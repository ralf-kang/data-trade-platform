# web 계층 (nginx) — 외부에 노출되는 유일한 진입점.
# 정적 자산은 캐싱 헤더를 붙여 바로 응답하고, 그 외 요청은 WAS(Next.js) 컨테이너로 프록시한다.

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  # Docker의 내장 DNS(127.0.0.11)를 명시적으로 사용한다.
  #
  # 중요: `upstream { server app:3000; }` 블록은 호스트명을 nginx 시작 시 단 한 번만
  # 조회해서 IP를 고정해버린다. 그래서 app 컨테이너를 재배포(`docker compose up --build`)
  # 하면 새 IP를 받는데 nginx는 죽은 옛 IP를 계속 붙들고 있어 502가 발생했다.
  # 아래처럼 proxy_pass 대상을 변수로 두면 nginx가 요청 시점마다 다시 DNS를 조회하므로,
  # app만 재배포해도 nginx 재시작 없이 정상 동작한다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $upstream_app app:3000;

  # Next.js 정적 빌드 산출물 — 해시가 파일명에 포함되므로 장기 캐시 가능
  # (nginx 자체 캐시 존은 두지 않고, 브라우저 캐시 헤더만 부여한다.)
  location /_next/static/ {
    proxy_pass http://$upstream_app$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    # 변수를 쓰는 proxy_pass는 원본 URI를 자동으로 이어붙이지 않으므로
    # $request_uri를 명시적으로 붙여준다.
    proxy_pass http://$upstream_app$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
