# web 계층 (nginx) — 외부에 노출되는 유일한 진입점.
# 정적 자산은 캐싱 헤더를 붙여 바로 응답하고, 그 외 요청은 WAS(Next.js) 컨테이너로 프록시한다.

upstream was_backend {
  # docker-compose 서비스명(app)으로 WAS 컨테이너를 찾는다.
  server app:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  # Next.js 정적 빌드 산출물 — 해시가 파일명에 포함되므로 장기 캐시 가능
  location /_next/static/ {
    proxy_pass http://was_backend;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://was_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
