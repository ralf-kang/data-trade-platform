# 3-tier 구성: web(nginx) -> was(Next.js app) -> db(postgres 정형 + elasticsearch 비정형)
#
# 사용법:
#   1) cp .env.example .env  (필요 시 값 수정)
#   2) docker compose up --build
#   3) http://localhost 로 접속 (nginx가 노출하는 유일한 포트)
#
# migrate 서비스가 먼저 실행되어 Postgres 스키마(prisma migrate deploy)를 적용한 뒤
# 정상 종료되고, 그 다음에야 app 서비스가 기동한다.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webreport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webreport}
      POSTGRES_DB: ${POSTGRES_DB:-webreport}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webreport} -d ${POSTGRES_DB:-webreport}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  elasticsearch:
    # @elastic/elasticsearch npm 클라이언트가 9.x이므로 서버도 9.x로 맞춘다
    # (버전 불일치 시 "Accept version must be either version 8 or 7" 에러 발생).
    # analysis-nori(한국어 형태소 분석) 플러그인을 설치한 이미지로 빌드한다.
    build:
      context: ./docker/elasticsearch
    image: web-report-editor-elasticsearch-nori:9.1.3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-changeme}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:${ELASTICSEARCH_PASSWORD:-changeme} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webreport}:${POSTGRES_PASSWORD:-webreport}@postgres:5432/${POSTGRES_DB:-webreport}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 웹서비스 로그 NAS 영구보존(.20 전용, kang-util WEBSVC-LOGS.md / CLAUDE.md §13).
    # NAS는 CIFS forceuid=1000,forcegid=1000,dir_mode=0750 마운트라 uid 1000만 쓸 수 있다.
    # 이 이미지의 기본 실행 사용자는 uid 1001(nextjs)이므로 uid/gid 1000(node)으로 전환한다 —
    # 실측 근거: 이미지에 node(1000:1000) 사용자가 존재하고, 앱이 읽는 /app(root:root 0755)·
    # /app/.next(0755)는 others 읽기가 열려 있으며, 런타임 파일 쓰기가 전혀 없다(docker diff 0줄).
    user: "1000:1000"
    volumes:
      - /mnt/synology/claude/logs/webservices/server1:/var/log/webservice
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webreport}:${POSTGRES_PASSWORD:-webreport}@postgres:5432/${POSTGRES_DB:-webreport}?schema=public
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-changeme}
      # LDAP 바인딩 비밀번호 등 비밀값의 AES-256-GCM 암호화 키(src/lib/crypto.ts).
      # 미설정이면 LDAP 설정 저장이 실패한다 — 약한 기본키로 조용히 넘어가지 않도록 의도한 동작.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    command:
      - sh
      - -c
      - |
        # 원래 CMD는 `node server.js`(Next.js standalone). stdout이 그대로 `docker logs`로
        # 나가면서 동시에 tee로 NAS 파일에도 append된다. 마운트가 쓰기 불가능하면 tee 없이
        # 평범하게 기동해 컨테이너가 죽지 않는다(방어적 폴백).
        # FIFO를 쓰는 이유: `exec node server.js | tee ...` 형태는 exec이 좌변 서브셸만 바꿀 뿐
        # PID 1이 sh로 남아 docker stop의 SIGTERM이 앱에 전달되지 않는다(graceful shutdown 실패
        # → SIGKILL → tee 버퍼 유실). FIFO는 node를 PID 1로 유지하고 tee는 백그라운드에서 읽는다.
        # mkfifo 앞 존재 체크는 컨테이너 재사용 시 멱등성 확보용.
        if [ -w /var/log/webservice ]; then
          [ -p /tmp/logpipe ] || mkfifo /tmp/logpipe
          tee -a /var/log/webservice/data-trade-platform-3503.log < /tmp/logpipe &
          exec node server.js > /tmp/logpipe 2>&1
        else
          exec node server.js
        fi

  # 데모 데이터 적재 전용 — 기본 `docker compose up`에는 포함되지 않고, 필요할 때만
  # 명시적으로 실행한다: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: seeder
    profiles: ["tools"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webreport}:${POSTGRES_PASSWORD:-webreport}@postgres:5432/${POSTGRES_DB:-webreport}?schema=public
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  web:
    image: nginx:alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - app
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  es_data:
