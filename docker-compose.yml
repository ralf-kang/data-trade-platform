# 3-tier 구성: web(nginx) -> was(Next.js app) -> db(postgres 정형 + elasticsearch 비정형)
#
# 사용법:
#   1) cp .env.example .env  (필요 시 값 수정)
#   2) docker compose up --build
#   3) http://localhost 로 접속 (nginx가 노출하는 유일한 포트)
#
# migrate 서비스가 먼저 실행되어 Postgres 스키마(prisma migrate deploy)를 적용한 뒤
# 정상 종료되고, 그 다음에야 app 서비스가 기동한다.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webreport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webreport}
      POSTGRES_DB: ${POSTGRES_DB:-webreport}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webreport} -d ${POSTGRES_DB:-webreport}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  elasticsearch:
    # @elastic/elasticsearch npm 클라이언트가 9.x이므로 서버도 9.x로 맞춘다
    # (버전 불일치 시 "Accept version must be either version 8 or 7" 에러 발생).
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-changeme}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:${ELASTICSEARCH_PASSWORD:-changeme} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webreport}:${POSTGRES_PASSWORD:-webreport}@postgres:5432/${POSTGRES_DB:-webreport}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webreport}:${POSTGRES_PASSWORD:-webreport}@postgres:5432/${POSTGRES_DB:-webreport}?schema=public
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-changeme}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  # 데모 데이터 적재 전용 — 기본 `docker compose up`에는 포함되지 않고, 필요할 때만
  # 명시적으로 실행한다: docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: seeder
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-webreport}:${POSTGRES_PASSWORD:-webreport}@postgres:5432/${POSTGRES_DB:-webreport}?schema=public
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - app
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  es_data:
